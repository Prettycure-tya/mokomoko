<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>絵文字アプリ - 速度調整版</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #1a1a1a;
            overflow: hidden;
            cursor: default;
        }

        .trail-emoji {
            position: fixed;
            font-size: 2.5rem;
            user-select: none;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(1);
            
            /* 【調整】消えるスピードを1.2秒にして、テンポよくフェードアウト */
            transition: transform 1.2s ease-out, opacity 1.2s ease-out;
            will-change: transform, opacity;
        }
    </style>
</head>
<body>

    <script>
        const emojis = ['✨', '💖', '🌟', '🎨', '🚀', '🔮', '🍿', '🧸'];
        
        let lastCreatedTime = 0;
        /* 【調整】出る間隔を 100ms → 50ms に。
           マウスを動かしたときに、より滑らかに繋がって出ます */
        const creationInterval = 50; 

        document.addEventListener('mousemove', (e) => {
            const currentTime = Date.now();

            if (currentTime - lastCreatedTime < creationInterval) {
                return;
            }
            
            lastCreatedTime = currentTime;

            const emojiEl = document.createElement('div');
            emojiEl.classList.add('trail-emoji');
            
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            emojiEl.textContent = randomEmoji;

            emojiEl.style.left = `${e.clientX}px`;
            emojiEl.style.top = `${e.clientY}px`;

            document.body.appendChild(emojiEl);

            setTimeout(() => {
                emojiEl.style.transform = 'translate(-50%, -50%) scale(0.2)'; 
                emojiEl.style.opacity = '0';
            }, 20);

            /* 【調整】消える速度（1.2秒＝1200ミリ秒）に合わせてお片付け */
            setTimeout(() => {
                emojiEl.remove();
            }, 1200);
        });
    </script>

</body>
</html>
